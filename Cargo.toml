[package]
name = "xlsxturbo"
version = "1.13.2"
edition = "2021"
description = "High-performance Excel writer with automatic type detection (pandas, polars, CSV)"
license = "MIT"
repository = "https://github.com/tstone-1/xlsxturbo"
keywords = ["excel", "xlsx", "csv", "converter", "performance"]
categories = ["command-line-utilities", "encoding"]

[lib]
name = "xlsxturbo_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "xlsxturbo"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# 0.102.0 is a floor, not a preference: each release up to it fixed something
# this crate relies on or a changelog entry promises. 0.98.2 fixed the
# `define_name` panic on an empty name (upstream #186) and 0.99.0 the missing
# name validation (#189), which is what makes a table name colliding with a
# defined name an error at all. The pre-flight in `lib.rs` reports that
# collision before the save, so an older crate would silently accept a workbook
# Excel then offers to repair. 0.100.0 made `add_worksheet_with_constant_memory`
# return a `Result` (it panicked when the temporary folder was unwritable),
# which `add_named_worksheet` relies on, and fixed comment authors being
# assigned to the wrong notes (#198). 0.101.0 made `TempFileError` carry its
# `io::Error` (#213), which `temp_file_failure` maps so that a refused
# temporary folder raises `FilePermissionError`. 0.102.0 fixed text rules in
# `conditional_formats` whose value holds a double quote or non-ASCII text,
# rule priorities on repeated ranges, and the quadratic time of placing many
# comments, images or charts on a sheet with `row_heights` or `column_widths`
# (the 1.12.2 changelog entry).
rust_xlsxwriter = { version = "0.102.0", features = ["constant_memory"] }
csv = "1.4"
clap = { version = "4.6", features = ["derive"], optional = true }
pyo3 = { version = "0.30", features = ["abi3-py311"] }
chrono = "0.4"
rayon = "1.12"
indexmap = "2.14"
# Staging file for atomic saves (see workbook::save_workbook). Already in the
# tree via rust_xlsxwriter, so this adds no new download.
tempfile = "3"
# NFC normalisation for table names (see parse::tables::sanitize_table_name).
# The sanitizer's allowlist is `is_alphanumeric() || '_'`, and a combining mark
# is neither, so decomposed text arrived as `Verka_ufe` for `Verkäufe`. NOT
# already in the tree -- this is a genuine new dependency, taken because the
# alternative (normalising in the Python layer) would leave the `cli` entry
# point unfixed.
unicode-normalization = "0.1"

[dev-dependencies]
# Property tests over src/parse/ (src/parse/proptests.rs). `default-features =
# false` drops the `fork`/`timeout` features, which pull in `rusty-fork` and
# `wait-timeout` and are unused here; `std` is still needed for the runner.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
