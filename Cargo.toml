[package]
name = "xlsxturbo"
version = "1.2.0"
edition = "2021"
description = "High-performance Excel writer with automatic type detection (pandas, polars, CSV)"
license = "MIT"
repository = "https://github.com/tstone-1/xlsxturbo"
keywords = ["excel", "xlsx", "csv", "converter", "performance"]
categories = ["command-line-utilities", "encoding"]

[lib]
name = "xlsxturbo_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["cli"]
cli = ["clap"]

[[bin]]
name = "xlsxturbo"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# 0.98.2 is a floor, not a preference: it is the release that fixed the
# `define_name` panic on an empty name (upstream #186), which is why
# `apply_defined_names` no longer screens for one.
rust_xlsxwriter = { version = "0.98.2", features = ["constant_memory"] }
csv = "1.4"
clap = { version = "4.6", features = ["derive"], optional = true }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
chrono = "0.4"
rayon = "1.12"
indexmap = "2.14"
# Staging file for atomic saves (see workbook::save_workbook). Already in the
# tree via rust_xlsxwriter, so this adds no new download.
tempfile = "3"
# NFC normalisation for table names (see parse::tables::sanitize_table_name).
# The sanitizer's allowlist is `is_alphanumeric() || '_'`, and a combining mark
# is neither, so decomposed text arrived as `Verka_ufe` for `Verkäufe`. NOT
# already in the tree -- this is a genuine new dependency, taken because the
# alternative (normalising in the Python layer) would leave the `cli` entry
# point unfixed.
unicode-normalization = "0.1"

[dev-dependencies]
# Property tests over src/parse/ (src/parse/proptests.rs). `default-features =
# false` drops the `fork`/`timeout` features, which pull in `rusty-fork` and
# `wait-timeout` and are unused here; `std` is still needed for the runner.
proptest = { version = "1.11", default-features = false, features = ["std", "bit-set"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
