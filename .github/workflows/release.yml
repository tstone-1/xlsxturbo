name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Third-party actions are pinned to commit SHAs; the trailing comment records
# which release each SHA was. See the note at the top of ci.yml.

permissions:
  contents: read

jobs:
  # Build wheels for Linux
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: 2_28

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # Build wheels for Windows
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          architecture: ${{ matrix.target }}

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  # Build wheels for macOS
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  # Build source distribution
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  # Software bill of materials.
  #
  # The Rust SBOM is the meaningful one: the crates in Cargo.lock are what is
  # statically linked into the shipped extension module. The Python side is
  # deliberately thin -- the wheel declares no runtime dependencies -- so it is
  # generated for completeness, not because it carries much.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Generate Rust SBOM (CycloneDX, cargo-cyclonedx 0.5.9)
        run: |
          # Pinned for the same reason cyclonedx-bom below is, and it matters
          # more here: this job runs only on a tag, `github-release` needs its
          # `sbom` artifact, and a breaking cargo-cyclonedx release would fail
          # the GitHub Release step after PyPI publish has already happened.
          # `--locked` pins the tool's dependencies, not the tool -- the version
          # has to be written out. It is in the step name too, because
          # `cargo install` prints `Successfully installed` for a version that
          # did not move, so the log alone does not say which one ran.
          cargo install cargo-cyclonedx@0.5.9 --locked
          cargo cyclonedx --format json --all
          mkdir -p sbom
          # cargo-cyclonedx writes per-manifest files next to each Cargo.toml.
          find . -name '*.cdx.json' -not -path './target/*' -exec cp {} sbom/ \;

      - name: Generate Python SBOM (CycloneDX)
        run: |
          # Pinned: this was unpinned, floated to 7.x, and the v0.19.0 release
          # failed on `unrecognized arguments: --outfile` -- 7.x renamed it to
          # `-o/--output-file`. Revisit when 8.x lands.
          pip install "cyclonedx-bom>=7,<8"
          cyclonedx-py environment --output-format JSON -o sbom/python-environment.cdx.json

      - name: List SBOMs
        run: ls -la sbom/

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom

  # Smoke-test the built wheels before publishing
  smoke-test:
    needs: [linux, windows, macos]
    strategy:
      fail-fast: false
      matrix:
        # Every published wheel is installed and exercised on a runner of its own
        # architecture. Publishing an artifact nobody has run is the one gap this
        # job exists to close, and it stayed open for the two cross-compiled
        # targets until 1.1.0.
        #
        # `expected-tag` is asserted against the downloaded filename below. Without
        # it a mistyped `wheel-artifact` silently tests some other wheel twice, and
        # two green legs that ran the same file look exactly like coverage.
        include:
          - os: ubuntu-latest
            wheel-artifact: wheels-linux-x86_64
            expected-tag: manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            wheel-artifact: wheels-linux-aarch64
            expected-tag: manylinux_2_28_aarch64
          - os: windows-latest
            wheel-artifact: wheels-windows-x64
            expected-tag: win_amd64
          - os: macos-latest
            wheel-artifact: wheels-macos-aarch64
            expected-tag: macosx_11_0_arm64
          # macos-13 was the Intel runner and has been retired; macos-15-intel is
          # the current x86_64 image. This leg is the only place the
          # cross-compiled Intel wheel is ever run on an Intel machine.
          - os: macos-15-intel
            wheel-artifact: wheels-macos-x86_64
            expected-tag: macosx_10_12_x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Download built wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.wheel-artifact }}
          path: dist

      - name: Verify the downloaded wheel is the one this leg exists to test
        shell: bash
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          name="$(basename "${wheels[0]}")"
          echo "wheel: $name"
          echo "runner: ${{ matrix.os }} ($(uname -m))"
          case "$name" in
            *"${{ matrix.expected-tag }}"*) ;;
            *) echo "::error::$name does not carry the expected platform tag ${{ matrix.expected-tag }}"
               exit 1 ;;
          esac

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Install built wheel
        shell: bash
        run: pip install dist/*.whl

      - name: Confirm the installed extension came from the wheel
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          python -c "
          import xlsxturbo, pathlib, sys
          location = pathlib.Path(xlsxturbo.__file__).resolve()
          print(f'xlsxturbo {xlsxturbo.version()} from {location}')
          print(f'python {sys.version.split()[0]}, platform {sys.platform}')
          if 'site-packages' not in location.parts:
              raise SystemExit(f'imported from {location}, not from the installed wheel')
          "

      - name: Run tests against the installed wheel
        shell: bash
        run: |
          # Run from outside the checkout's working directory so pytest's
          # rootdir-based sys.path insertion cannot pull in the local
          # python/ source tree instead of the wheel-installed package.
          mkdir -p "$RUNNER_TEMP/smoke-test"
          cp -r tests "$RUNNER_TEMP/smoke-test/"
          cd "$RUNNER_TEMP/smoke-test"
          python -m pytest tests/ -q

  # Publish to PyPI
  release:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist, smoke-test]
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
      url: https://pypi.org/p/xlsxturbo
    permissions:
      id-token: write      # Required for trusted publishing
      attestations: write  # Required for build provenance
      contents: read
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List wheels
        run: ls -la dist/

      # Attest before publishing: the attestation binds these exact bytes to
      # this workflow run, so it must cover what is about to be uploaded.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # Create the GitHub Release for this tag.
  #
  # Every tag before v0.18.0 had no corresponding Release, which left the
  # changelog and the artifacts hard to find from the repo's own Releases page.
  # Creating it here means that can no longer drift: a tag that builds and
  # publishes also gets its Release, with the SBOMs attached.
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom

      # Slicing lives in a script, not inline here, because the same logic backs
      # the one-off backfill of the pre-0.18.0 tags -- and because it needed
      # testing against all 37 existing tags before it could be trusted. The
      # script exits non-zero on a missing section, so a tag whose CHANGELOG
      # entry was forgotten fails the job instead of publishing empty notes.
      - name: Extract release notes from CHANGELOG
        run: |
          bash .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
          echo "--- release notes for $GITHUB_REF_NAME ---"
          cat release-notes.md

      # gh is preinstalled on GitHub runners, so this needs no third-party action.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/* sbom/*
