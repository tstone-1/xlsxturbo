name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to commit SHAs, not tags: a tag is mutable and
# can be repointed at new code by whoever owns the action. The trailing comment
# records which release each SHA was, since a SHA is unreadable to a human.
#
# dtolnay/rust-toolchain additionally gets an explicit `toolchain:` input. That
# action normally takes the toolchain from its ref name (`@stable`), which a
# pinned SHA no longer carries -- and a SHA taken from the `nightly` branch
# would look identical here while silently changing the compiler.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.4,<2.0" "pandas>=2,<3" "polars>=1,<2" "openpyxl>=3,<4" "pytest>=8,<9"

      - name: Build and install xlsxturbo
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run Python integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  python-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\activate
          pip install "maturin>=1.4,<2.0" "pandas>=2,<3" "polars>=1,<2" "openpyxl>=3,<4" "pytest>=8,<9"

      - name: Build and install xlsxturbo
        run: |
          .venv\Scripts\activate
          maturin develop --release

      - name: Run Python integration tests
        run: |
          .venv\Scripts\activate
          pytest tests/ -v

  python-test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.4,<2.0" "pandas>=2,<3" "polars>=1,<2" "openpyxl>=3,<4" "pytest>=8,<9"

      - name: Build and install xlsxturbo
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run Python integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pylint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pylint-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # Install into a project-local .venv, which is what pyproject.toml's
      # [tool.pyright] venvPath/venv point at. Installing into the system
      # interpreter instead made pyright log "venv .venv subdirectory not
      # found" and analyse a different environment than a contributor gets
      # locally -- so the gate could pass on one and fail on the other, which
      # it duly did. A gate that disagrees with its documented local command is
      # worse than no gate: it grants false confidence in both directions.
      - name: Install project with dev extras
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run ruff
        run: .venv/bin/ruff check python tests benchmarks scripts

      - name: Run bandit
        run: .venv/bin/bandit -c pyproject.toml -r python

      - name: Run pyright
        run: .venv/bin/pyright

  # ---------------------------------------------------------------------------
  # Supply-chain gates
  # ---------------------------------------------------------------------------

  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      # cargo-audit is installed rather than run through a third-party action:
      # a job whose whole purpose is deciding what to trust should not widen the
      # set of things being trusted to do it.
      - name: Cache cargo-audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-v1

      - name: Install cargo-audit
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ]; then
            cargo install cargo-audit --locked
          fi

      - name: Run cargo audit
        run: cargo audit --deny warnings

  pip-audit:
    name: pip-audit (dev and build deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # The shipped wheel has no runtime dependencies, so what is worth auditing
      # is the dev and build toolchain that produces and tests it.
      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit an explicit requirements list rather than the live environment.
      #
      # `--strict` fails on any *skipped* dependency, and auditing the
      # environment necessarily meets one: xlsxturbo itself is installed
      # editable and has no advisory record to look up. `--skip-editable` does
      # not help -- it turns the editable dist into a skip, which is exactly
      # what `--strict` rejects. `pip freeze --exclude-editable` removes it
      # before pip-audit ever sees it, so nothing is skipped and `--strict`
      # stays meaningful over everything that remains.
      #
      # The line count is printed and asserted non-empty on purpose. An empty
      # requirements file makes pip-audit report "No known vulnerabilities
      # found" -- a pass that cannot fail, indistinguishable from a real one.
      # That happened while developing this job, because `pip freeze` returns
      # nothing in a uv-created venv (uv installs no pip into it).
      - name: Collect dependencies to audit
        run: |
          pip freeze --exclude-editable > audit-requirements.txt
          count=$(wc -l < audit-requirements.txt)
          echo "auditing $count dependencies"
          if [ "$count" -lt 1 ]; then
            echo "refusing to run a vacuous audit over an empty dependency list" >&2
            exit 1
          fi
          cat audit-requirements.txt

      - name: Run pip-audit
        run: pip-audit --strict -r audit-requirements.txt

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust analysis is supported from CodeQL 2.22.1 without the experimental
        # flag. It is newer than the Python analyzer, so the two run as separate
        # matrix legs with fail-fast off: a problem in the Rust leg must not
        # suppress Python results, or vice versa.
        language: [python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:${{ matrix.language }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Compares the dependency manifests of the base and head refs, so it is
    # meaningful only on a pull request.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
