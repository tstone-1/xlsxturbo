name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned to commit SHAs, not tags: a tag is mutable and
# can be repointed at new code by whoever owns the action. The trailing comment
# records which release each SHA was, since a SHA is unreadable to a human.
#
# Comments carry the FULL version (`# v7.0.1`, not `# v7`). Dependabot rewrites
# such a comment only when it matches the tag being replaced, and a `# v4`
# shorthand was silently left behind on a bump to v5.0.0 -- a correct SHA with a
# wrong label, which no build failure will ever reveal.
#
# dtolnay/rust-toolchain additionally gets an explicit `toolchain:` input. That
# action normally takes the toolchain from its ref name (`@stable`), which a
# pinned SHA no longer carries -- and a SHA taken from the `nightly` branch
# would look identical here while silently changing the compiler.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

  python-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
        requirements: ['requirements-test.txt']
        # requirements-test.txt allows pandas 2 or 3 and pip always resolves to
        # the newest, so without this leg pandas 2 is declared supported and
        # never run. `include` adds a combination rather than merging, because
        # `requirements` is an existing matrix key with a different value.
        include:
          - python-version: '3.12'
            requirements: 'requirements-test-pandas2.txt'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.9,<2.0" -r ${{ matrix.requirements }}

      - name: Report the resolved DataFrame library versions
        run: |
          source .venv/bin/activate
          python -c "import pandas, polars; print(f'pandas {pandas.__version__}, polars {polars.__version__}')"

      - name: Build and install xlsxturbo
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run Python integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  python-test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\activate
          pip install "maturin>=1.9,<2.0" -r requirements-test.txt

      - name: Build and install xlsxturbo
        run: |
          .venv\Scripts\activate
          maturin develop --release

      - name: Run Python integration tests
        run: |
          .venv\Scripts\activate
          pytest tests/ -v

  python-test-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-py${{ matrix.python-version }}-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.9,<2.0" -r requirements-test.txt

      - name: Build and install xlsxturbo
        run: |
          source .venv/bin/activate
          maturin develop --release

      - name: Run Python integration tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  coverage:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    # This job REPORTS coverage. It must never gate a merge on the number, and
    # `scripts/coverage_report.py` deliberately passes no `--fail-under`.
    #
    # A coverage threshold is a target, and a target gets met -- by tests that
    # execute lines without asserting anything, which is worse than no data
    # because it reads as progress. What is worth reading here is *which*
    # branches are unexercised; the percentage is context for that list.
    #
    # The job can still fail, and should: a failure here means the measurement
    # broke, not that coverage fell.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin>=1.9,<2.0" "coverage[toml]>=7" -r requirements-test.txt

      - name: Measure coverage
        run: |
          # `pipefail` is not on by default in an Actions `run:` step, and
          # `tee` reports its own exit status -- so without this a script that
          # died mid-run would still mark the step green.
          set -o pipefail
          source .venv/bin/activate
          python scripts/coverage_report.py --html --lcov coverage.info | tee coverage.txt

      - name: Publish the report to the job summary
        # `always()` so a failed measurement still shows whatever it got to
        # before it stopped, which is where the diagnosis starts.
        if: always()
        run: |
          {
            echo '## Coverage (informational — no threshold)'
            echo
            echo '```'
            cat coverage.txt || echo 'the measurement produced no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the browsable report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: |
            target/coverage-html
            coverage.info
            coverage.txt
          if-no-files-found: warn
          retention-days: 14

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-pylint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-pylint-

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Install into a project-local .venv, which is what pyproject.toml's
      # [tool.pyright] venvPath/venv point at. Installing into the system
      # interpreter instead made pyright log "venv .venv subdirectory not
      # found" and analyse a different environment than a contributor gets
      # locally -- so the gate could pass on one and fail on the other, which
      # it duly did. A gate that disagrees with its documented local command is
      # worse than no gate: it grants false confidence in both directions.
      - name: Install project with dev extras
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run ruff
        run: .venv/bin/ruff check python tests benchmarks scripts

      - name: Run bandit
        run: .venv/bin/bandit -c pyproject.toml -r python

      - name: Run pyright
        run: .venv/bin/pyright

  # ---------------------------------------------------------------------------
  # Supply-chain gates
  # ---------------------------------------------------------------------------

  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      # cargo-audit is installed rather than run through a third-party action:
      # a job whose whole purpose is deciding what to trust should not widen the
      # set of things being trusted to do it.
      #
      # The cache key carries the version on purpose. It used to be a fixed
      # `-bin-v1`, which never missed, so the cached binary was whatever the
      # first run happened to install and no bump could ever reach the runner --
      # a pin with no version written down anywhere. Bumping the version below
      # changes the key, misses the cache, and installs the new one.
      # The advisory database is fetched at run time, so pinning the binary does
      # not pin what it knows about.
      - name: Cache cargo-audit binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-0.22.2

      - name: Install cargo-audit 0.22.2
        run: |
          if [ ! -x "$HOME/.cargo/bin/cargo-audit" ]; then
            cargo install cargo-audit@0.22.2 --locked
          fi

      - name: Run cargo audit
        run: cargo audit --deny warnings

  pip-audit:
    name: pip-audit (dev and build deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # The shipped wheel has no runtime dependencies, so what is worth auditing
      # is the dev and build toolchain that produces and tests it.
      - name: Install project with dev extras
        run: pip install -e ".[dev]"

      - name: Install pip-audit
        run: pip install pip-audit

      # Audit an explicit requirements list rather than the live environment.
      #
      # `--strict` fails on any *skipped* dependency, and auditing the
      # environment necessarily meets one: xlsxturbo itself is installed
      # editable and has no advisory record to look up. `--skip-editable` does
      # not help -- it turns the editable dist into a skip, which is exactly
      # what `--strict` rejects. `pip freeze --exclude-editable` removes it
      # before pip-audit ever sees it, so nothing is skipped and `--strict`
      # stays meaningful over everything that remains.
      #
      # The line count is printed and asserted non-empty on purpose. An empty
      # requirements file makes pip-audit report "No known vulnerabilities
      # found" -- a pass that cannot fail, indistinguishable from a real one.
      # That happened while developing this job, because `pip freeze` returns
      # nothing in a uv-created venv (uv installs no pip into it).
      - name: Collect dependencies to audit
        run: |
          pip freeze --exclude-editable > audit-requirements.txt
          count=$(wc -l < audit-requirements.txt)
          echo "auditing $count dependencies"
          if [ "$count" -lt 1 ]; then
            echo "refusing to run a vacuous audit over an empty dependency list" >&2
            exit 1
          fi
          cat audit-requirements.txt

      - name: Run pip-audit
        run: pip-audit --strict -r audit-requirements.txt

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust analysis is supported from CodeQL 2.22.1 without the experimental
        # flag. It is newer than the Python analyzer, so the two run as separate
        # matrix legs with fail-fast off: a problem in the Rust leg must not
        # suppress Python results, or vice versa.
        language: [python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch (no tag)
        with:
          toolchain: stable

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:${{ matrix.language }}

  action-pins:
    name: Action pin comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Confirms each pinned SHA's version comment still names that SHA.
      # Dependabot bumps the SHA but rewrites the comment only when it matches
      # the tag being replaced, so a stale label survives a fully green build --
      # which is how `# v4` ended up labelling v5.0.0 here.
      - name: Check action pin comments match their SHAs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/check-action-pins.sh

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # Compares the dependency manifests of the base and head refs, so it is
    # meaningful only on a pull request.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
