version: 2
updates:
  # Rust dependencies (Cargo.toml)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # GitHub Actions
  #
  # Actions in .github/workflows/ are pinned to commit SHAs. Dependabot does
  # bump the SHA, so pinning costs no update visibility -- but it rewrites the
  # trailing version comment only when that comment matches the tag it is
  # replacing. The first bump here (dependency-review-action 4.9.0 -> 5.0.0)
  # moved the SHA to v5.0.0 and left `# v4` in place, which is the worst
  # outcome: an unreadable SHA carrying a wrong human label is more misleading
  # than no label at all.
  #
  # So the comments carry the FULL version (`# v7.0.1`, not `# v7`). After any
  # action bump, check that the comment moved with the SHA -- a stale comment is
  # invisible in a green build.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3

  # Python dev, build, and docs toolchain (pyproject.toml, requirements-docs.txt).
  #
  # The shipped wheel has no runtime dependencies, so what this tracks is the
  # `[project.optional-dependencies] dev` group, the build backend, and the
  # pinned MkDocs stack. Note that uv.lock is tracked but is NOT updated by
  # Dependabot -- run `uv lock` after merging one of these, as AGENTS.md
  # requires when dev deps change. requirements-docs.txt has no lockfile; its
  # pins are the lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # pytest 9 requires Python >= 3.10; this project supports 3.9, so the
      # 3.9 CI jobs cannot resolve it at all -- pip fails before a single test
      # runs. Nothing in the suite is incompatible with pytest 9, so this hold
      # ends when 3.9 is dropped and needs no code change.
      #
      # An ignore that outlives its reason is invisible: the PR simply stops
      # arriving. `tests/test_ci_config.py` ties this entry to
      # `requires-python` in both directions, so dropping 3.9 fails the suite
      # until this block goes with it.
      - dependency-name: "pytest"
        update-types: ["version-update:semver-major"]
